{% extends "admin/change_list.html" %}
{% block extrastyle %}{{ block.super }}
<style>
  .kanban-resumen{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0 18px;max-width:calc(100% - 270px)}   /* deja libre el botón «Añadir» */
  @media(max-width:1000px){.kanban-resumen{max-width:none;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}}
  .kanban-resumen .col{color:#fff;padding:12px 14px;border-radius:16px;min-width:0;font-size:.82rem;box-shadow:0 10px 15px -3px rgba(59,36,24,.15)}
  .kanban-resumen .col b{display:block;font-size:24px;line-height:1.1}
</style>
{% endblock %}
{% block content_title %}
{{ block.super }}
<div class="kanban-resumen">
  {% for c in resumen_kanban %}
  <div class="col" style="background:{{ c.color }}"><b>{{ c.total }}</b>{{ c.nombre }}</div>
  {% endfor %}
</div>
{% endblock %}
