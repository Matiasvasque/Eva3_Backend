<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso bloqueado · Dulce Arte</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;font-family:'Poppins',system-ui,sans-serif;color:#3b2418;
    background:radial-gradient(55% 40% at 90% 0%,rgba(244,199,207,.6),transparent 70%),#fbf6ee}
  .caja{max-width:440px;background:#fffdf8;border-radius:28px;padding:34px 30px;box-shadow:0 25px 50px -12px rgba(59,36,24,.3)}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:1.7rem;margin:6px 0 10px}
  p{color:#8a7263;margin:0 0 22px}
  a{display:inline-block;padding:11px 26px;border-radius:999px;background:#3b2418;color:#fffdf8;text-decoration:none;font-weight:500}
</style>
</head>
<body>
  <div class="caja">
    <div style="font-size:2.4rem">🔒</div>
    <h1>Acceso bloqueado temporalmente</h1>
    <p>Hubo demasiados intentos fallidos de inicio de sesión. Espera 15 minutos e inténtalo de nuevo, o pide a un administrador que te desbloquee.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
